---

version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the gh-pr-feedback binary
    cmds:
      - go build -o gh-pr-feedback ./main.go
    sources:
      - '**/*.go'
    generates:
      - gh-pr-feedback
  
  build:dist:
    desc: Build binaries to dist directory
    cmds:
      - mkdir -p dist
      - go build -o dist/gh-pr-feedback ./main.go
    sources:
      - '**/*.go'
    generates:
      - dist/gh-pr-feedback

  run:
    desc: Run gh-pr-feedback with arguments
    cmds:
      - go run ./main.go {{.CLI_ARGS}}

  release:snapshot:
    desc: Build snapshot release locally (no git tag required)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  install:
    desc: Install gh-pr-feedback to ~/bin
    cmds:
      - mkdir -p ~/bin
      - go build -o ~/bin/gh-pr-feedback ./main.go
      - echo "Installed to ~/bin/gh-pr-feedback"

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race -parallel 12 ./...

  test:uncached:
    desc: Run all tests without caching
    cmds:
      - go test -count=1 -race -parallel 12 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - bin/golangci-lint run ./...

  format:
    desc: Format code
    cmds:
      - gofmt -w .

  lint:fix:
    desc: Run linters with fix
    cmds:
      - bin/golangci-lint run --fix ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
